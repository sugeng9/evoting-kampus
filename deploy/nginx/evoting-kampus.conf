# ==============================================================================
# NGINX PRODUCTION CONFIGURATION - E-VOTING KAMPUS (PEMIRA)
# POLITEKNIK NEGERI BENGKALIS
# Disiapkan untuk Beban Puncak 6.000 Pemilih Bersamaan (Peak Concurrency)
# ==============================================================================

# Rate Limiting Zones (Definisi di level http atau sebelum blok server)
# limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
# limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
# limit_req_zone $binary_remote_addr zone=otp_limit:10m rate=3r/m;

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name pemira.polbeng.ac.id evoting.polbeng.ac.id;

    # Certbot challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/evoting-kampus/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pemira.polbeng.ac.id evoting.polbeng.ac.id;

    root /var/www/evoting-kampus/public;
    index index.php index.html;

    # SSL / TLS Modern Hardening
    ssl_certificate /etc/letsencrypt/live/pemira.polbeng.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pemira.polbeng.ac.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers (Defense-in-Depth)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Ukuran payload berkas (KTM upload maks 3MB)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Log Files
    access_log /var/log/nginx/evoting_access.log combined buffer=64k flush=5s;
    error_log /var/log/nginx/evoting_error.log warn;

    # Gzip Compression Tuning
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Front Controller Pattern
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pembatasan Laju Akses untuk Titik Rawan Brute Force & Flooding
    location ~* ^/(pemilih/login|login) {
        # limit_req zone=login_limit burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location ~* ^/daftar/otp {
        # limit_req zone=otp_limit burst=3 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Static Assets Caching (CSS, JS, Fonts, Images)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    # PHP-FPM FastCGI Handler
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Sesuaikan dengan versi PHP
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # FastCGI Buffering Tuning (Optimasi Concurrency 6.000 voters)
        fastcgi_buffer_size 32k;
        fastcgi_buffers 64 8k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_connect_timeout 10s;
        fastcgi_hide_header X-Powered-By;
    }

    # BLOKIR AKSES KE FILE/FOLDER KRITIS
    # 1. File tersembunyi (.env, .git, .htaccess, dll)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 2. Direktori internal Laravel & source code
    location ~ ^/(app|bootstrap|config|database|resources|routes|storage|tests|vendor) {
        deny all;
        return 404;
    }

    # 3. File konfigurasi dan dependensi
    location ~ \.(lock|json|xml|yml|yaml|md|log)$ {
        deny all;
        return 404;
    }

    # 4. Storage private (berkas KTM privat tidak boleh diakses langsung via web URL)
    location ^~ /storage/private_ktm/ {
        deny all;
        return 404;
    }
}
